name: Deploy MeetNest

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /home/ubuntu/pj3
          git pull origin main

      - name: Install backend deps
        run: |
          cd /home/ubuntu/pj3/backend
          npm install

      - name: Restart backend
        run: |
          pm2 restart meetnest-backend || pm2 start src/app.js --name meetnest-backend
          pm2 save

      - name: Install frontend deps
        run: |
          cd /home/ubuntu/pj3/frontend
          npm install

      - name: Build frontend
        run: |
          cd /home/ubuntu/pj3/frontend
          export NODE_OPTIONS=--max_old_space_size=512
          npm run build

      - name: Fix permissions
        run: |
          sudo chmod -R o+r /home/ubuntu/pj3/frontend/build

      - name: Reload nginx
        run: |
          sudo systemctl reload nginx